name: Battleship — New Game

on:
  # Can be triggered manually from the Actions tab
  workflow_dispatch:
  # Or via issue labeled "battleship-admin"
  issues:
    types: [labeled]

jobs:
  new-game:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'battleship-admin'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize new game
        run: node init-game.js

      - name: Commit new game
        run: |
          git config user.name  "Battleship Bot"
          git config user.email "actions@github.com"
          git add README.md game-state.json
          git diff --cached --quiet || git commit -m "🆕 New Battleship game started!"
          git push
